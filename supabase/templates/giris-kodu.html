<!doctype html>
<html lang="tr">
<body style="margin:0;padding:24px;background:#f6f4ef;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#222">
  <div style="max-width:420px;margin:0 auto;background:#fff;border-radius:12px;padding:28px">
    <p style="margin:0 0 16px;font-size:16px">Giriş kodunuz:</p>
    <p style="margin:0 0 20px;font-size:34px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:14px;color:#555">Kodu oyundaki giriş ekranına yazın. Kod bir saat geçerlidir ve bir kez kullanılır.</p>
    <p style="margin:0;font-size:13px;color:#888">Bu isteği siz yapmadıysanız bu e-postayı yok sayın.</p>
    <hr style="border:none;border-top:1px solid #eee;margin:20px 0">
    <p style="margin:0;font-size:12px;color:#888">Your sign-in code is shown above. It is valid for one hour.</p>
  </div>
</body>
</html>
